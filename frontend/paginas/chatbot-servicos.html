<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impacto Jovem - Chatbot de Serviços</title>
    <link rel="stylesheet" href="../css/base.css">
    <style>
        .chat-container { max-width: 850px; margin: 45px auto; padding: 20px; }
        .chat-box { height: 500px; overflow-y: auto; padding: 20px; border-radius: 20px; background: rgba(255,255,255,.65); border: 1px solid #ddd; }
        .mensagem { padding: 12px 16px; margin: 10px 0; border-radius: 15px; max-width: 78%; white-space: pre-line; line-height: 1.5; }
        .usuario { margin-left: auto; background: #7c3aed; color: white; }
        .bot { margin-right: auto; background: white; color: #1e1b4b; }
        .chat-input { display: flex; gap: 10px; margin-top: 15px; }
        .chat-input input { flex: 1; padding: 15px; border-radius: 10px; border: 1px solid #ddd; }
        .chat-input button { padding: 15px 25px; border: none; border-radius: 10px; background: #7c3aed; color: white; cursor: pointer; }
        .atalhos { display:flex; flex-wrap:wrap; gap:8px; margin:15px 0; }
        .atalhos button { border:1px solid #7c3aed; background:white; color:#6a0dad; border-radius:20px; padding:8px 12px; cursor:pointer; }
    </style>
</head>
<body>
<header class="main-header">
    <div class="logo">Impacto Jovem</div>
    <nav>
        <a href="index.html">Início</a>
        <a href="chatbot.html">Chatbot</a>
        <a href="chatbot-servicos.html" class="active">Serviços</a>
        <a href="sobre.html">Sobre</a>
    </nav>
</header>
<main class="chat-container">
    <h1>🏥 Chatbot de Serviços</h1>
    <p>Consulte o Ollama usando os dados do CSV do projeto.</p>
    <div class="atalhos">
        <button onclick="usar('Quais clínicas estão cadastradas no CSV?')">Clínicas cadastradas</button>
        <button onclick="usar('Faça um resumo dos dados de atendimento.')">Resumo dos dados</button>
        <button onclick="usar('Quais registros possuem sucesso?')">Registros de sucesso</button>
    </div>
    <div id="chatBox" class="chat-box">
        <div class="mensagem bot">Olá! Sou o assistente de serviços. Posso consultar os dados disponíveis no CSV e explicar o que eles mostram.</div>
    </div>
    <div class="chat-input">
        <input id="mensagem" type="text" placeholder="Pergunte sobre os serviços cadastrados..." autocomplete="off">
        <button onclick="enviarMensagem()">Enviar</button>
    </div>
</main>
<script>
const API = "http://127.0.0.1:5000/chat-servicos";
const box = document.getElementById("chatBox");
const input = document.getElementById("mensagem");
function adicionarMensagem(texto, tipo) {
    const div = document.createElement("div");
    div.className = "mensagem " + tipo;
    div.textContent = texto;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}
async function enviarMensagem() {
    const mensagem = input.value.trim();
    if (!mensagem) return;
    adicionarMensagem(mensagem, "usuario");
    input.value = "";
    try {
        const r = await fetch(API, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({mensagem}) });
        const dados = await r.json();
        adicionarMensagem(dados.resposta || dados.erro || "Sem resposta.", "bot");
    } catch (e) {
        adicionarMensagem("Não consegui conectar ao Flask. Inicie o backend e verifique se o Ollama está funcionando.", "bot");
    }
}
function usar(texto) { input.value = texto; enviarMensagem(); }
input.addEventListener("keydown", e => { if (e.key === "Enter") enviarMensagem(); });
</script>
</body>
</html>
