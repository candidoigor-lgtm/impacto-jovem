<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impacto Jovem - Serviços</title><link rel="stylesheet" href="../css/base.css">
<style>
.chat-container{max-width:900px;margin:45px auto;padding:0 20px}.chat-box{height:450px;overflow-y:auto;padding:20px;background:#faf7ff;border-radius:16px;border:1px solid #e5e7eb}.mensagem{max-width:75%;padding:12px 16px;margin:10px 0;border-radius:15px;white-space:pre-line}.bot{background:#ede9fe;color:#1e1b4b}.usuario{margin-left:auto;background:#6a0dad;color:white}.chat-input{display:flex;gap:10px;margin-top:15px}.chat-input input{flex:1;padding:14px;border:1px solid #d1d5db;border-radius:10px}.chat-input button{padding:14px 22px;border:0;border-radius:10px;background:#6a0dad;color:white;font-weight:bold;cursor:pointer}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.chips button{border:1px solid #a855f7;background:white;color:#6a0dad;padding:8px 12px;border-radius:20px;cursor:pointer}
</style></head>
<body>
<header class="main-header"><div class="logo">🚀 Impacto Jovem</div><nav><a href="index.html">Início</a><a href="chatbot.html">Chatbot de Apoio</a><a href="chatbot-servicos.html" class="active">Serviços</a><a href="sobre.html">Sobre</a></nav></header>
<main class="chat-container"><h1>🏥 Chatbot de Serviços</h1><p>Consulte informações sobre serviços de acolhimento e atendimento.</p>
<div id="chatBox" class="chat-box"><div class="mensagem bot">Olá! 👋 Posso ajudar com localização, horários, tipos de atendimento e serviços disponíveis.</div></div>
<div class="chips"><button onclick="sugerir('Quais serviços estão disponíveis?')">Serviços disponíveis</button><button onclick="sugerir('Quais são os horários?')">Horários</button><button onclick="sugerir('Quais serviços atendem urgência?')">Urgência</button><button onclick="sugerir('Onde encontro os serviços?')">Localização</button></div>
<div class="chat-input"><input id="mensagem" placeholder="Digite sua dúvida..." autocomplete="off"><button onclick="enviarMensagem()">Enviar</button></div></main>
<footer><p>&copy; 2026 Impacto Jovem. Desenvolvido para o CEEP Maringá.</p></footer>
<script>
const box=document.getElementById('chatBox'), input=document.getElementById('mensagem');
function add(t,c){const d=document.createElement('div');d.className='mensagem '+c;d.textContent=t;box.appendChild(d);box.scrollTop=box.scrollHeight;}
function sugerir(t){input.value=t;enviarMensagem();}
async function enviarMensagem(){const m=input.value.trim();if(!m)return;add(m,'usuario');input.value='';try{const r=await fetch('http://127.0.0.1:5000/chat-servicos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mensagem:m})});const d=await r.json();add(d.resposta||'Não encontrei uma resposta.','bot');}catch(e){const x=m.toLowerCase();let r='Posso ajudar com serviços, horários, localização, atendimento e urgência.';if(x.includes('hor'))r='Os serviços cadastrados podem possuir informações de dias e horários de funcionamento.';else if(x.includes('urg'))r='Consulte os serviços cadastrados para verificar quais possuem atendimento de urgência.';else if(x.includes('local')||x.includes('endereço'))r='O sistema pode usar informações de endereço e localização dos serviços cadastrados.';add(r,'bot');}}
input.addEventListener('keydown',e=>{if(e.key==='Enter')enviarMensagem()});
</script></body></html>
