<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Impacto Jovem - Chatbot</title>

    <link rel="stylesheet" href="../css/base.css">

    <style>

        .chat-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .chat-box {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            border-radius: 20px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .mensagem {
            padding: 12px 16px;
            margin: 10px 0;
            border-radius: 15px;
            max-width: 75%;
        }

        .usuario {
            margin-left: auto;
            background: #7c3aed;
        }

        .bot {
            margin-right: auto;
            background: #1e1b4b;
        }

        .chat-input {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .chat-input input {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: none;
        }

        .chat-input button {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #7c3aed;
            color: white;
            cursor: pointer;
        }

    </style>
</head>

<body>

<header class="main-header">

    <div class="logo">
        Impacto Jovem
    </div>

    <nav>
        <a href="index.html">Início</a>
        <a href="chatbot.html" class="active">
            Chatbot
        </a>
        <a href="sobre.html">
            Sobre
        </a>
    </nav>

</header>


<main class="chat-container">

    <h1>Assistente Impacto Jovem</h1>

    <p>
        Converse com nosso assistente para obter informações
        e orientações.
    </p>


    <div id="chatBox" class="chat-box">

        <div class="mensagem bot">
            Olá! Sou o assistente do Impacto Jovem.
            Como posso ajudar?
        </div>

    </div>


    <div class="chat-input">

        <input
            type="text"
            id="mensagem"
            placeholder="Digite sua mensagem..."
        >

        <button onclick="enviarMensagem()">
            Enviar
        </button>

    </div>

</main>


<script>

async function enviarMensagem() {

    const input = document.getElementById("mensagem");

    const mensagem = input.value.trim();

    if (!mensagem) {
        return;
    }

    adicionarMensagem(
        mensagem,
        "usuario"
    );

    input.value = "";

    try {

        const resposta = await fetch(
            "http://127.0.0.1:5000/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    mensagem: mensagem
                })
            }
        );

        const dados = await resposta.json();

        adicionarMensagem(
            dados.resposta,
            "bot"
        );

    } catch (erro) {

        adicionarMensagem(
            "Não consegui conectar ao servidor.",
            "bot"
        );

    }

}


function adicionarMensagem(
    texto,
    tipo
) {

    const chatBox =
        document.getElementById("chatBox");

    const div =
        document.createElement("div");

    div.className =
        "mensagem " + tipo;

    div.textContent =
        texto;

    chatBox.appendChild(div);

    chatBox.scrollTop =
        chatBox.scrollHeight;
}

</script>

</body>

</html>
